name: Release

on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify npm supports Trusted Publishing
        run: |
          npm --version
          node --version

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # Dogfooded — both commands route through layermix so the workflow
          # stays in sync with `task-runner.json`. `--ci` forces linear mode
          # so output streams cleanly to the action log.
          publish: pnpm start release --ci
          version: pnpm start version --ci
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
